# CFIZZ 完整分析环境（含 Agent 与 fastq 预处理工具）
# 在仓库根目录一键创建:
#   micromamba env create -f environment.yml
#   micromamba activate cfizz
#   cfizz-agent --check

name: cfizz
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # === 基础运行时 ===
  # Python 3.11 是当前 Docker、CI 和本地安装共同验证的版本。
  - python=3.11
  - pip

  # === 数值 / 数据栈 ===
  - numpy>=1.26,<2
  - pandas>=2,<3
  - scipy>=1.10,<2
  - cytoolz>=0.12,<2

  # === 绘图栈 ===
  - matplotlib-base>=3.8,<4
  - seaborn-base>=0.13,<0.14

  # === Hi-C 核心:矩阵 I/O + 算法 ===
  - cooler>=0.10,<0.11
  - cooltools>=0.7,<0.8
  - bioframe>=0.7,<0.9

  # === BigWig 读写(7_x 整合图 + 4_1 demo 必需) ===
  - pybigwig>=0.3

  # === 辅助(统计 + 性能) ===
  - scikit-image>=0.22,<0.27
  - scikit-learn>=1.0
  - statsmodels>=0.13
  - patsy>=0.5          # statsmodels 依赖
  - h5py>=3.0
  - pyarrow>=10.0       # cooler/cooltools 大文件底层
  - numba>=0.56
  - cython>=3.0
  - tqdm>=4.60

  # === Hi-C 生态工具(cooler/pairtools 链) ===
  - htslib>=1.18         # samtools/pysam 底层
  - samtools>=1.18       # BAM 处理
  - pysam>=0.22          # samtools 的 Python 绑定
  - pairtools>=1.0       # Hi-C pairs 文件处理
  - pairix>=0.3          # pairtools 配套索引
  - pyfaidx>=0.7         # FASTA 索引(若用户备 fasta)
  - ucsc-fetchchromsizes # cooler/cooltools 初始化

  # === 测序预处理(完整流程必需,fastq → mcool 全链路) ===
  - fastp>=1.0           # fastq 质控 + adapter 修剪
  - bwa-mem2>=2.2        # fastq → sam 比对(Hi-C 第一步)

  # === pip 补充区（同时安装当前 GitHub checkout）===
  - pip:
      - -e .[agent]
      - hicpeaks>=0.3.0
      - adjustText>=1.0
