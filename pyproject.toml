[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfizz"
version = "0.2.0"
description = "Chromosome Flow Integration with Zone-Terminal Visualization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["bioinformatics", "hi-c", "chromosome-conformation-capture", "zone-terminal-visualization", "tad", "loop", "compartment"]
authors = [
    {name = "cfizz developers"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.10,<2",
    "pandas>=2,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "cooler>=0.10,<0.11",
    "cooltools>=0.7,<0.8",
    "bioframe>=0.7,<0.9",
    "scikit-image>=0.22,<0.27",
    "cytoolz>=0.12,<2",
]

[project.optional-dependencies]
all = [
    "pyBigWig>=0.3",
    "pysam>=0.22",
    "pyfaidx>=0.7",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "adjustText>=1.0",
    "hicpeaks>=0.3.0",
]
agent = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.29,<0.36",
    "httpx>=0.27,<0.29",
    "anyio>=4.3,<4.10",
    "openai>=2,<3",
    "pydantic>=2.7,<3",
    "pysam>=0.22",
    "pyBigWig>=0.3",
]

[project.scripts]
cfizz-agent = "cfizz.agent.cli:main"

[project.urls]
"Homepage" = "https://github.com/peiheng-jia/cfizz-agent"
"Repository" = "https://github.com/peiheng-jia/cfizz-agent"
"Issues" = "https://github.com/peiheng-jia/cfizz-agent/issues"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cfizz*"]
exclude = ["examples*", "demo*", "tests*", "scripts*", "docs*", "build*", "dist*", "_*"]

[tool.setuptools.package-data]
"cfizz" = ["*.md"]
"cfizz.preprocessing" = ["*.sh", "*.py", "*.md"]
"cfizz.agent" = [
    "capabilities.json",
    "static/*",
    "resources/README.md",
    "resources/demo/*.json",
    "resources/demo/data/*",
    "resources/references/hg38/*",
]
